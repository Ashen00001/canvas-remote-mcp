# Fly.io deploy config. Change `app` to a unique name, then:
#   fly launch --no-deploy --copy-config
#   fly secrets set CANVAS_API_TOKEN=... CANVAS_BASE_URL=... BASE_URL=... \
#                   GITHUB_CLIENT_ID=... GITHUB_CLIENT_SECRET=... \
#                   ALLOWED_GITHUB_USERS=...
#   fly deploy

app = "canvas-remote-mcp"
primary_region = "sea"   # closest region

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep at least one machine warm so Cowork never hits a cold-start timeout
  # mid-handshake. Set min_machines_running = 0 to save money if you don't
  # mind the occasional slow first call.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
