# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Free plan sleeps after ~15 min idle; first request after sleep takes
# 30-50s to cold start. That can time out claude.ai's connector handshake.
# If it proves flaky, upgrade this service to Starter (no sleep) or move to Fly.
#
# All six env vars are marked `sync: false`, so Render prompts for them in the
# dashboard instead of storing them in this repo. Values are in local .env.

services:
  - type: web
    name: canvas-remote-mcp
    runtime: docker
    plan: free
    region: oregon          # closest free region
    dockerfilePath: ./Dockerfile
    autoDeploy: true

    # /health is the one unauthenticated route (returns "ok", no data).
    healthCheckPath: /health

    envVars:
      - key: CANVAS_API_TOKEN
        sync: false
      - key: CANVAS_BASE_URL
        sync: false
      - key: BASE_URL          # must be the live https://<name>.onrender.com (no trailing slash)
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: ALLOWED_GITHUB_USERS
        sync: false
      # Free Upstash Redis URL (rediss://...). Keeps OAuth state across
      # spin-downs so the claude.ai connector stops needing reconnects.
      - key: REDIS_URL
        sync: false
